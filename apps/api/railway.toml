[build]
buildCommand = "SKIP_ENV_VALIDATION=true pnpm install --frozen-lockfile && SKIP_ENV_VALIDATION=true pnpm turbo build --filter=@hub-starter/api..."

[deploy]
startCommand = "cd apps/api && node --import tsx index.ts"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
